<!DOCTYPE html>
<html>
<head>
<title>AI Motion Generator</title>

<style>

body{
background:#111;
font-family:Arial;
text-align:center;
color:white;
padding:20px;
}

.box{
background:#222;
padding:20px;
border-radius:20px;
max-width:400px;
margin:auto;
margin-top:40px;
}

button{
padding:15px 25px;
background:#00bfff;
border:none;
color:white;
font-size:18px;
border-radius:10px;
margin-top:20px;
cursor:pointer;
}

img,video{
width:100%;
margin-top:20px;
border-radius:15px;
}

#status{
margin-top:15px;
font-size:16px;
color:#00ffcc;
}

</style>

</head>

<body>

<div class="box">

<h1>AI Motion Generator</h1>

<input type="file" id="photoInput">

<br><br>

<label>Upload Motion Video</label>

<br><br>

<input type="file" id="videoInput">

<br><br>

<button onclick="generateMotion()">
Generate Motion
</button>

<p id="status"></p>

<video id="outputVideo" controls></video>

</div>

<script>

const API_TOKEN = "r8_OgIfnd6uzs0dxXGXGahsl6eliyABzU83ybRzM";

async function uploadFile(file){

const formData = new FormData();
formData.append("content", file);

const response = await fetch(
"https://dreambooth-api-experimental.replicate.com/upload",
{
method:"POST",
headers:{
Authorization:`Token ${API_TOKEN}`
},
body:formData
}
);

const data = await response.json();

return data.url;

}

async function generateMotion(){

const photoFile =
document.getElementById("photoInput").files[0];

const videoFile =
document.getElementById("videoInput").files[0];

if(!photoFile || !videoFile){

alert("Photo aur Motion Video dono upload karo");

return;

}

document.getElementById("status").innerHTML =
"AI Generating Motion...";

try{

const imageUrl = await uploadFile(photoFile);

const motionVideoUrl = await uploadFile(videoFile);

const response = await fetch(
"https://api.replicate.com/v1/predictions",
{
method:"POST",

headers:{
"Content-Type":"application/json",
Authorization:`Token ${API_TOKEN}`
},

body:JSON.stringify({

version:
"3f0457eaf0f7c5b2d3f3a4d2fdbef674e7dc86d51fdd8f04fbfdbb6c4d7a8f2d",

input:{
image:imageUrl,
motion_video:motionVideoUrl
}

})

}
);

const prediction = await response.json();

checkStatus(prediction.urls.get);

}
catch(error){

console.log(error);

document.getElementById("status").innerHTML =
"Error aa gaya";

}

}

async function checkStatus(url){

const response = await fetch(url,{
headers:{
Authorization:`Token ${API_TOKEN}`
}
});

const result = await response.json();

if(result.status==="succeeded"){

document.getElementById("status").innerHTML =
"Motion Generated Successfully";

document.getElementById("outputVideo").src =
result.output;

}
else if(result.status==="failed"){

document.getElementById("status").innerHTML =
"Generation Failed";

}
else{

document.getElementById("status").innerHTML =
"AI Processing...";

setTimeout(()=>{
checkStatus(url);
},3000);

}

}

</script>

</body>
</html>
