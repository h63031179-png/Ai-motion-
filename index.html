<!DOCTYPE html>
<html>
<head>
<title>Free AI Motion</title>

<style>
body{
background:black;
font-family:Arial;
text-align:center;
padding:30px;
color:white;
}

.box{
background:#1e1e1e;
padding:20px;
border-radius:20px;
max-width:350px;
margin:auto;
}

button{
padding:14px 25px;
border:none;
border-radius:10px;
background:#00bfff;
color:white;
font-size:18px;
margin-top:15px;
}

img,video{
width:100%;
border-radius:15px;
margin-top:15px;
}
</style>
</head>

<body>

<div class="box">

<h1>AI Motion Generator</h1>

<input type="file" id="imageInput">

<br><br>

<button onclick="generateVideo()">
Generate Motion
</button>

<p id="status"></p>

<img id="preview">

<video id="video" controls></video>

</div>

<script>

async function generateVideo(){

const file=document.getElementById("imageInput").files[0];

if(!file){
alert("Upload image first");
return;
}

document.getElementById("status").innerHTML="Generating AI Motion...";

const img=document.getElementById("preview");
img.src=URL.createObjectURL(file);

const video=document.getElementById("video");

setTimeout(()=>{

video.src=
"https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4";

document.getElementById("status").innerHTML=
"Free Demo Motion Generated";

},3000);

}

</script>

</body>
</html>
