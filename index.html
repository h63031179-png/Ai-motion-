<!DOCTYPE html>
<html>
<head>
<title>AI Motion Generator</title>

<style>
body{
background:#000;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
color:white;
}

.box{
background:#1f1f1f;
padding:20px;
border-radius:20px;
width:320px;
text-align:center;
}

button{
background:#00bfff;
color:white;
border:none;
padding:12px 20px;
border-radius:10px;
font-size:18px;
margin-top:15px;
cursor:pointer;
}

img,video{
width:100%;
margin-top:20px;
border-radius:15px;
}

#status{
margin-top:15px;
color:#00ffcc;
}
</style>
</head>

<body>

<div class="box">

<h1>AI Motion Generator</h1>

<input type="file" id="imageInput" accept="image/*">

<br><br>

<button onclick="generateVideo()">
Generate Motion
</button>

<p id="status"></p>

<img id="preview">

<video id="video" controls></video>

</div>

<script>

const API_TOKEN =
"r8_OgIfnd6uzs0dxXGXGahsl6eliyABzU83ybRzM";

async function generateVideo(){

const imageFile =
document.getElementById("imageInput").files[0];

if(!imageFile){
alert("Upload image first");
return;
}

document.getElementById("status").innerText =
"Uploading image...";

const formData = new FormData();

formData.append("file", imageFile);

const uploadResponse = await fetch(
"https://tmpfiles.org/api/v1/upload",
{
method:"POST",
body:formData
});

const uploadData = await uploadResponse.json();

let imageUrl = uploadData.data.url;

imageUrl = imageUrl.replace(
"https://tmpfiles.org/",
"https://tmpfiles.org/dl/"
);

document.getElementById("preview").src =
URL.createObjectURL(imageFile);

document.getElementById("status").innerText =
"Generating AI video...";

const response = await fetch(
"https://api.replicate.com/v1/predictions",
{
method:"POST",

headers:{
"Authorization":"Token " + API_TOKEN,
"Content-Type":"application/json"
},

body:JSON.stringify({

version:
"140d9dbf44b15b6f4c7fa6f1c3e7c8ff772c6c5e1b7f6f4e0d5b5d9e7c9f7a8",

input:{
image:imageUrl,
prompt:"person talking naturally",
num_frames:48
}

})

});

const result = await response.json();

const predictionId = result.id;

checkVideo(predictionId);

}

async function checkVideo(id){

const interval = setInterval(async()=>{

const response = await fetch(
"https://api.replicate.com/v1/predictions/" + id,
{
headers:{
"Authorization":"Token " + API_TOKEN
}
});

const data = await response.json();

document.getElementById("status").innerText =
data.status;

if(data.status === "succeeded"){

clearInterval(interval);

let outputVideo = data.output;

if(Array.isArray(outputVideo)){
outputVideo = outputVideo[0];
}

document.getElementById("video").src =
outputVideo;

document.getElementById("status").innerText =
"Video Generated Successfully";

}

if(data.status === "failed"){

clearInterval(interval);

document.getElementById("status").innerText =
"Generation Failed";

}

},3000);

}

</script>

</body>
</html>
