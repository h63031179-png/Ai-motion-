<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Motion Generator</title>

<style>
body{
margin:0;
padding:0;
background:black;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
background:#1f1f1f;
padding:20px;
border-radius:15px;
width:320px;
text-align:center;
color:white;
}

h1{
font-size:30px;
}

input{
margin-top:15px;
width:100%;
}

button{
margin-top:20px;
padding:12px 20px;
background:#00bfff;
border:none;
border-radius:10px;
color:white;
font-size:18px;
cursor:pointer;
}

img,video{
width:100%;
margin-top:20px;
border-radius:10px;
}

#status{
margin-top:15px;
color:#00ffcc;
}
</style>
</head>

<body>

<div class="box">

<h1>AI Motion Generator</h1>

<input type="file" id="imageInput" accept="image/*">

<button onclick="generateMotion()">Generate Motion</button>

<div id="status"></div>

<img id="preview">

<video id="video" controls autoplay loop></video>

</div>

<script>

async function generateMotion(){

const image = document.getElementById("imageInput").files[0];

if(!image){
alert("Upload image first");
return;
}

document.getElementById("status").innerHTML =
"Generating AI Motion...";

const previewURL = URL.createObjectURL(image);

document.getElementById("preview").src = previewURL;

setTimeout(()=>{

document.getElementById("status").innerHTML =
"Free Demo Motion Generated";

document.getElementById("video").src =
"https://cdn.pixabay.com/video/2022/10/17/135070-761546803_tiny.mp4";

},3000);

}

</script>

</body>
</html>
