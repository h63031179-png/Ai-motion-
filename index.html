<!DOCTYPE html>
<html>
<head>
<title>AI Motion Generator</title>

<style>
body{
background:#000;
font-family:Arial;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
background:#1e1e1e;
padding:20px;
border-radius:20px;
width:320px;
text-align:center;
}

button{
background:#00bfff;
color:white;
border:none;
padding:12px 20px;
border-radius:10px;
font-size:18px;
margin-top:15px;
}

img,video{
width:100%;
margin-top:20px;
border-radius:15px;
}
</style>
</head>

<body>

<div class="box">

<h1>AI Motion Generator</h1>

<input type="file" id="imageInput">

<br><br>

<button onclick="generateVideo()">
Generate Motion
</button>

<p id="status"></p>

<img id="preview">

<video id="video" controls></video>

</div>

<script>

const API_TOKEN = "YOUR_TOKEN_HERE";

async function generateVideo(){

const imageFile =
document.getElementById("imageInput").files[0];

if(!imageFile){
alert("Upload image first");
return;
}

document.getElementById("status").innerText =
"Uploading image...";

const formData = new FormData();
formData.append("file", imageFile);

const upload =
await fetch("https://tmpfiles.org/api/v1/upload",{
method:"POST",
body:formData
});

const uploadData = await upload.json();

let imageUrl =
uploadData.data.url;

imageUrl =
imageUrl.replace(
"https://tmpfiles.org/",
"https://tmpfiles.org/dl/"
);

document.getElementById("preview").src =
URL.createObjectURL(imageFile);

document.getElementById("status").innerText =
"Generating AI video...";

const response = await fetch(
"https://api.replicate.com/v1/predictions",
{
method:"POST",
headers:{
"Authorization":"Token " + API_TOKEN,
"Content-Type":"application/json"
},
body:JSON.stringify({
version:"b19c7d5f5a8b6f80d8f3f0c84f0b5c6f",
input:{
image:imageUrl,
prompt:"person talking naturally",
duration:5,
quality:"720p"
}
})
}
);

const data = await response.json();

const id = data.id;

checkResult(id);

}

async function checkResult(id){

const interval = setInterval(async()=>{

const response = await fetch(
"https://api.replicate.com/v1/predictions/" + id,
{
headers:{
"Authorization":"Token " + API_TOKEN
}
}
);

const data = await response.json();

document.getElementById("status").innerText =
data.status;

if(data.status==="succeeded"){

clearInterval(interval);

document.getElementById("video").src =
data.output;

document.getElementById("status").innerText =
"Video Generated Successfully";

}

if(data.status==="failed"){

clearInterval(interval);

document.getElementById("status").innerText =
"Failed";

}

},3000);

}

</script>

</body>
</html>
