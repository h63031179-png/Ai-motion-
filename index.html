<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Motion Generator</title>

<style>
body{
margin:0;
padding:0;
background:#000;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
background:#1e1e1e;
padding:20px;
border-radius:15px;
width:320px;
text-align:center;
color:white;
box-shadow:0 0 20px rgba(0,0,0,0.5);
}

h1{
font-size:32px;
margin-bottom:20px;
}

input{
margin:10px 0;
color:white;
width:100%;
}

button{
background:#00bfff;
border:none;
padding:12px 20px;
border-radius:10px;
color:white;
font-size:18px;
cursor:pointer;
margin-top:15px;
}

button:hover{
background:#009acd;
}

img,video{
width:100%;
margin-top:20px;
border-radius:12px;
}

#status{
margin-top:15px;
color:#00ffcc;
font-size:16px;
}
</style>
</head>

<body>

<div class="box">

<h1>AI Motion Generator</h1>

<input type="file" id="imageInput" accept="image/*">

<button onclick="generateVideo()">Generate Motion</button>

<div id="status"></div>

<img id="previewImage">

<video id="outputVideo" controls autoplay loop></video>

</div>

<script>

const HF_TOKEN = "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";

async function generateVideo(){

const imageFile = document.getElementById("imageInput").files[0];

if(!imageFile){
alert("Please upload image");
return;
}

document.getElementById("status").innerHTML = "AI Generating Motion...";

const reader = new FileReader();

reader.onload = async function(){

const imageBase64 = reader.result;

document.getElementById("previewImage").src = imageBase64;

try{

const response = await fetch(
"https://api-inference.huggingface.co/models/alibaba-pai/EasyAnimateV3-XL-2-InP",
{
method:"POST",
headers:{
"Authorization":"Bearer " + HF_TOKEN,
"Content-Type":"application/json"
},
body:JSON.stringify({
inputs:"A boy smiling and talking naturally, realistic motion, cinematic live portrait",
image:imageBase64
})
}
);

if(!response.ok){

document.getElementById("status").innerHTML =
"Server Busy Or Free Limit Finished";

return;
}

const blob = await response.blob();

const videoURL = URL.createObjectURL(blob);

document.getElementById("outputVideo").src = videoURL;

document.getElementById("status").innerHTML =
"Motion Generated Successfully";

}
catch(error){

document.getElementById("status").innerHTML =
"Error Generating Video";

console.log(error);

}

};

reader.readAsDataURL(imageFile);

}

</script>

</body>
</html>
