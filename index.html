<!DOCTYPE html>
<html>
<head>
<title>AI Motion</title>

<style>
body{
background:#111;
color:white;
font-family:Arial;
text-align:center;
padding:30px;
}

.box{
background:#222;
padding:20px;
border-radius:20px;
max-width:350px;
margin:auto;
}

button{
padding:15px 25px;
font-size:18px;
background:#00bfff;
color:white;
border:none;
border-radius:10px;
margin-top:20px;
}

img,video{
width:250px;
margin-top:20px;
border-radius:15px;
display:none;
}
</style>
</head>

<body>

<div class="box">

<h1>AI Motion Generator</h1>

<input type="file" id="photoInput">

<br><br>

<button onclick="generateMotion()">
Generate Motion
</button>

<br><br>

<img id="preview">

<video id="outputVideo" controls></video>

<p id="status"></p>

</div>

<script>

const API_TOKEN = "r8_OgIfnd6uzs0dxXGXGahsl6eliyABzU83ybRzM";

async function generateMotion() {

const photo =
document.getElementById("photoInput").files[0];

if (!photo) {
alert("Photo upload karo");
return;
}

document.getElementById("status").innerText =
"Generating AI Motion...";

const imageUrl =
URL.createObjectURL(photo);

document.getElementById("preview").src =
imageUrl;

document.getElementById("preview").style.display =
"block";

try {

const response = await fetch(
"https://api.replicate.com/v1/predictions",
{
method: "POST",
headers: {
"Authorization": "Token " + API_TOKEN,
"Content-Type": "application/json"
},
body: JSON.stringify({
version:
"3f0457e0a029d658ce4f8a7e8b6c11f1a5f7d1b6",
input: {
prompt: "make image move"
}
})
}
);

const data = await response.json();

console.log(data);

document.getElementById("status").innerText =
"AI Connected Successfully!";

}
catch(error){

console.log(error);

document.getElementById("status").innerText =
"Connection Error";

}

}

</script>

</body>
</html>
