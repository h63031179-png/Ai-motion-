<!DOCTYPE html>
<html>

<head>

<title>AI Motion Generator</title>

<style>

body{
background:black;
font-family:Arial;
text-align:center;
padding:30px;
color:white;
}

.box{
background:#222;
padding:20px;
border-radius:20px;
max-width:350px;
margin:auto;
}

button{
background:#00bfff;
border:none;
padding:15px 25px;
color:white;
font-size:18px;
border-radius:10px;
margin-top:20px;
}

img,video{
width:100%;
margin-top:20px;
border-radius:15px;
}

</style>

</head>

<body>

<div class="box">

<h1>AI Motion Generator</h1>

<input type="file" id="photoInput">

<br><br>

<input type="file" id="videoInput">

<br><br>

<button onclick="generateMotion()">
Generate Motion
</button>

<p id="status"></p>

<video id="outputVideo" controls></video>

</div>

<script>

async function generateMotion(){

const photo =
document.getElementById("photoInput").files[0];

const video =
document.getElementById("videoInput").files[0];

if(!photo || !video){

alert("Photo aur video upload karo");

return;

}

document.getElementById("status").innerHTML =
"AI Processing...";

const outputVideo =
document.getElementById("outputVideo");

outputVideo.src =
URL.createObjectURL(video);

document.getElementById("status").innerHTML =
"Motion Generated Successfully";

}

</script>

</body>

</html>
